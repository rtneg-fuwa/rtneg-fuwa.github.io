<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ボールの池 時計</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#0e2a33; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; box-shadow:0 0 60px rgba(0,0,0,.45); }
  #debug {
    position:fixed; right:10px; bottom:8px; color:rgba(255,255,255,.75);
    font:13px/1.4 system-ui, sans-serif; background:rgba(10,40,50,.45);
    padding:3px 9px; border-radius:8px; display:none; user-select:none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="debug"></div>
<script>
"use strict";
// Ball Pond Clock v3
// - Loose plan A + fusion: red = hour (12h), yellow = minutes/5, blue = seconds/5,
//   small cream balls = leftover minutes (0-4). No digital face.
// - Balls splash into the middle, then drift to rim slots of their colour:
//     blue: front/bottom rim L->R, yellow: left rim bottom->top, red: back/top rim L->R,
//     minute balls: small row inside the base of the left rim. Right rim stays open.
// - At rollovers balls do NOT sink: they gather and fuse into the next unit up
//   (blue set -> minute ball, minute set -> yellow, yellow set -> red,
//    red set -> one gold ball that flows out through the open right rim).
// - Ripples: height-field simulation on the pond disc, warped onto the screen
//   ellipse (same method as the stream's wave_proto_v2).
const W = 1280, H = 720;
const CX = 640, CY = 400, RX = 505, RY = 178;
const DUCK_OB_DX = 30, DUCK_OB_DY = 24, DUCK_OB_RX = 122, DUCK_OB_RY = 62;
const TELEGRAPH = 0.25, FALL = 0.45, FALL_DIST = 430, BOUNCE = 0.35;
const SINK_TIME = 1.4;
const SLOT_SCALE = 0.88;
const FUSE_TIME = 1.8;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + "px"; cv.style.height = (H * s) + "px";
}
addEventListener("resize", fit); fit();

const bg = new Image(); bg.src = "assets/background-a.png";
const duckImg = new Image(); duckImg.src = "assets/duck_watercolor.png";
const DUCK_W = 185;
let DUCK_H = 185;
duckImg.onload = () => { DUCK_H = DUCK_W * duckImg.height / duckImg.width; };

// idx: 0=red(hour) 1=yellow(min/5) 2=blue(sec/5) 3=minute(1min, small cream) 4=gold (exit special)
const COLORS = [
  { hi:"#ffe3de", mid:"#f2604f", deep:"#c93325" },
  { hi:"#fff6c4", mid:"#ffd94d", deep:"#d99a17" },
  { hi:"#d9ecff", mid:"#4da6ff", deep:"#1c63b8" },
  { hi:"#fffef6", mid:"#ffe9a8", deep:"#dfba5e" },
  { hi:"#fff3c4", mid:"#ffc400", deep:"#d99400" },
];
const BASE_R = [30, 30, 30, 17, 34];
const PRODUCT = { 2: 3, 3: 1, 1: 0, 0: 4 };   // fusion product of each colour
const FUSE_MIN = { 2: 8, 3: 3, 1: 8, 0: 8 };   // min set size for a rollover fusion

function slotPos(idx, i) {
  let deg, scale = SLOT_SCALE;
  if (idx === 0) deg = 262 + i * (74 / 11);
  else if (idx === 1) deg = 152 + i * (96 / 11);
  else if (idx === 2) deg = 138 - i * (103 / 11);
  else if (idx === 3) { deg = 143.5 + i * 5.2; scale = 0.70; }
  else return [CX, CY];
  const a = deg * Math.PI / 180;
  return [CX + RX * scale * Math.cos(a), CY + RY * scale * Math.sin(a)];
}
function depthScale(y) {
  const t = (y - (CY - RY)) / (2 * RY);
  return 0.86 + 0.34 * Math.max(0, Math.min(1, t));
}
function duckPos(t) {
  return [470 + 95 * Math.sin(t * 0.11) + 30 * Math.sin(t * 0.043),
          395 + 42 * Math.sin(t * 0.083 + 1.2)];
}

/* ---------------- wave simulation (pond space, disc grid) ---------------- */
const WN = 160;
const wave = {
  cur: new Float32Array(WN * WN),
  prev: new Float32Array(WN * WN),
  nxt: new Float32Array(WN * WN),
  mask: new Float32Array(WN * WN),
};
for (let j = 0; j < WN; j++) for (let i = 0; i < WN; i++) {
  const u = (i + 0.5) * (2 / WN) - 1, v = (j + 0.5) * (2 / WN) - 1;
  wave.mask[j * WN + i] = (u * u + v * v <= 1.0) ? 1 : 0;
}
const DAMPING = 0.996;
function waveStep() {
  const { cur, prev, nxt, mask } = wave;
  for (let j = 1; j < WN - 1; j++) {
    const row = j * WN;
    for (let i = 1; i < WN - 1; i++) {
      const k = row + i;
      nxt[k] = ((cur[k - 1] + cur[k + 1] + cur[k - WN] + cur[k + WN]) * 0.5 - prev[k]) * DAMPING * mask[k];
    }
  }
  wave.prev = cur; wave.cur = nxt; wave.nxt = prev;
}
function waveSplash(px, py, strength, radiusCells) {
  const u = (px - CX) / RX, v = (py - CY) / RY;
  const gx = Math.round((u * 0.5 + 0.5) * (WN - 1));
  const gy = Math.round((v * 0.5 + 0.5) * (WN - 1));
  const r = radiusCells;
  for (let j = Math.max(0, gy - r); j <= Math.min(WN - 1, gy + r); j++)
    for (let i = Math.max(0, gx - r); i <= Math.min(WN - 1, gx + r); i++) {
      const dx = i - gx, dy = j - gy;
      wave.cur[j * WN + i] += strength * Math.exp(-(dx * dx + dy * dy) / (1.3 * 1.3));
    }
}
function waveHeightAt(px, py) {
  const u = (px - CX) / RX, v = (py - CY) / RY;
  const gx = Math.max(0, Math.min(WN - 1, Math.round((u * 0.5 + 0.5) * (WN - 1))));
  const gy = Math.max(0, Math.min(WN - 1, Math.round((v * 0.5 + 0.5) * (WN - 1))));
  return wave.cur[gy * WN + gx];
}
const shadeCv = document.createElement("canvas");
shadeCv.width = WN; shadeCv.height = WN;
const shadeCtx = shadeCv.getContext("2d");
const shadeImg = shadeCtx.createImageData(WN, WN);
function renderShade() {
  const { cur } = wave;
  const d = shadeImg.data;
  for (let j = 0; j < WN; j++) {
    const row = j * WN;
    for (let i = 0; i < WN; i++) {
      const k = row + i;
      const gx = (i > 0 && i < WN - 1) ? cur[k + 1] - cur[k - 1] : 0;
      const gy = (j > 0 && j < WN - 1) ? cur[k + WN] - cur[k - WN] : 0;
      let s = (gx + 0.7 * gy) * 0.016;
      s = Math.max(-0.38, Math.min(0.38, s));
      const val = Math.max(0, Math.min(255, Math.round(128 + s * 340)));
      const o = k * 4;
      d[o] = val; d[o + 1] = val; d[o + 2] = val; d[o + 3] = 255;
    }
  }
  shadeCtx.putImageData(shadeImg, 0, 0);
}

/* ---------------- balls, fusions, clock ---------------- */
let balls = [];
let fusions = [];   // {fromIdx, productIdx, x, y, t0}
let droplets = [];
let spawnQueue = [];
let lastSpawnAt = -10;

function pickLanding(t) {
  const [dx, dy] = duckPos(t + TELEGRAPH + FALL);
  let best = null, bestScore = -1;
  for (let i = 0; i < 40; i++) {
    const ang = Math.random() * Math.PI * 2;
    const rad = Math.sqrt(Math.random()) * 0.55;
    const x = CX + rad * RX * Math.cos(ang);
    const y = CY + rad * RY * Math.sin(ang);
    const ex = (x - (dx + DUCK_OB_DX)) / (DUCK_OB_RX + 18);
    const ey = (y - (dy + DUCK_OB_DY)) / (DUCK_OB_RY + 22);
    if (ex * ex + ey * ey < 1.0) continue;
    let dmin = 1e9;
    for (const b of balls) {
      if (b.state !== "drifting" && b.state !== "settled") continue;
      dmin = Math.min(dmin, Math.hypot(x - b.x, (y - b.y) * 1.6));
    }
    if (dmin > bestScore) { best = [x, y]; bestScore = dmin; }
    if (dmin > 95) break;
  }
  return best || [CX, CY];
}
function ballR(b) {
  const y = (b.state === "incoming") ? b.ty : b.y;
  return BASE_R[b.idx] * depthScale(y);
}
function aliveOf(idx) {
  return balls.filter(b => b.idx === idx &&
    (b.state === "drifting" || b.state === "settled" || b.state === "born"));
}
function pendingOf(idx) { return fusions.filter(f => f.productIdx === idx).length; }

function newBall(idx, state, x, y, t) {
  const b = { tx: x, ty: y, x, y, vx: 0, vy: 0, idx,
              slot: aliveOf(idx).length, t0: t, state,
              impactT: null, bornT0: state === "born" ? t : -1, exitT0: 0,
              phase: Math.random() * Math.PI * 2, drift: Math.random() * Math.PI * 2,
              sinkT0: 0, fusion: null, drawScale: 1 };
  balls.push(b);
  return b;
}
function makeBall(idx, t, instant) {
  if (instant) {
    const [sx, sy] = slotPos(idx, aliveOf(idx).length);
    const b = newBall(idx, "settled", sx, sy, t);
    b.impactT = -10;
    return b;
  }
  const [tx, ty] = pickLanding(t);
  return newBall(idx, "incoming", tx, ty, t);
}
function desiredCounts(now) {
  return [ now.getHours() % 12, Math.floor(now.getMinutes() / 5),
           Math.floor(now.getSeconds() / 5), now.getMinutes() % 5 ];
}
function startFusion(idx, t) {
  const set = aliveOf(idx);
  if (!set.length) return;
  let fx = 0, fy = 0;
  for (const b of set) { fx += b.x; fy += b.y; }
  fx /= set.length; fy /= set.length;
  // clamp the fusion point into the pond's middle area
  const ex = (fx - CX) / (RX * 0.55), ey = (fy - CY) / (RY * 0.55);
  const d2 = ex * ex + ey * ey;
  if (d2 > 1) { const d = Math.sqrt(d2); fx = CX + ex / d * RX * 0.55; fy = CY + ey / d * RY * 0.55; }
  const f = { fromIdx: idx, productIdx: PRODUCT[idx], x: fx, y: fy, t0: t };
  fusions.push(f);
  for (const b of set) { b.state = "gathering"; b.fusion = f; }
}
function completeFusion(f, t) {
  balls = balls.filter(b => b.fusion !== f);
  fusions = fusions.filter(x => x !== f);
  waveSplash(f.x, f.y, -150, 4);
  const drops = [];
  for (let i = 0; i < 12; i++) drops.push([(Math.random() * 2 - 1), 30 + Math.random() * 45, 2.2 + Math.random() * 2.0]);
  const prod = f.productIdx;
  if (prod === 4) {
    const g = newBall(4, "exiting", f.x, f.y, t);
    g.exitT0 = t;
    droplets.push({ x: f.x, y: f.y, r: 34, t0: t, drops });
  } else {
    const b = newBall(prod, "born", f.x, f.y, t);
    b.slot = Math.max(0, aliveOf(prod).length - 1);
    droplets.push({ x: f.x, y: f.y, r: ballR(b), t0: t, drops });
  }
}

let initialized = false;
function syncClock(t, now) {
  const want = desiredCounts(now);
  if (!initialized) {
    initialized = true;
    for (let idx = 0; idx < 4; idx++)
      for (let i = 0; i < want[idx]; i++) makeBall(idx, t, true);
    return;
  }
  // bottom-up so a fusion chain (blue->minute->yellow->red) settles in order
  for (const idx of [2, 3, 1, 0]) {
    const alive = aliveOf(idx);
    const queued = spawnQueue.filter(q => q === idx).length;
    const pending = pendingOf(idx);
    if (alive.length + queued + pending < want[idx]) {
      for (let i = alive.length + queued + pending; i < want[idx]; i++) spawnQueue.push(idx);
    } else if (alive.length > want[idx]) {
      const fusionRunning = fusions.some(f => f.fromIdx === idx);
      if (want[idx] === 0 && alive.length >= FUSE_MIN[idx] && !fusionRunning) {
        startFusion(idx, t);
      } else if (!fusionRunning) {
        let excess = alive.length - want[idx];
        for (const b of alive) {
          if (excess <= 0) break;
          b.state = "sinking"; b.sinkT0 = t; excess--;
        }
        aliveOf(idx).forEach((b, i) => { b.slot = i; if (b.state === "settled") b.state = "drifting"; });
      }
    }
  }
}

function drawBall(x, y, r, idx, alpha, submerge) {
  const c = COLORS[idx];
  ctx.save();
  ctx.globalAlpha = alpha;
  const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.15, x, y, r);
  g.addColorStop(0, c.hi); g.addColorStop(0.45, c.mid); g.addColorStop(1, c.deep);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(255,255,255,.55)";
  ctx.beginPath(); ctx.ellipse(x - r * 0.36, y - r * 0.44, r * 0.20, r * 0.12, -0.6, 0, Math.PI * 2); ctx.fill();
  if (submerge > 0) {
    // lower part sits IN the water: tint it with pond water below the waterline
    const wy = y + r * submerge;
    ctx.save();
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.clip();
    const wg = ctx.createLinearGradient(0, wy, 0, y + r);
    wg.addColorStop(0, "rgba(130,185,210,.20)");
    wg.addColorStop(1, "rgba(85,145,180,.48)");
    ctx.fillStyle = wg;
    ctx.fillRect(x - r, wy, r * 2, r - r * submerge + 1);
    ctx.restore();
    // waterline meniscus: bright front arc, faint back arc
    ctx.lineWidth = Math.max(1.4, r * 0.055);
    ctx.strokeStyle = "rgba(255,255,255,.55)";
    ctx.beginPath(); ctx.ellipse(x, wy, r * 0.99, r * 0.32, 0, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.22)";
    ctx.beginPath(); ctx.ellipse(x, wy, r * 0.99, r * 0.32, 0, 1.15 * Math.PI, 1.85 * Math.PI); ctx.stroke();
  }
  ctx.restore();
}

let lastNow = performance.now() / 1000;
let startT = lastNow;
let waveAcc = 0, duckWakeAt = 0;
function frame() {
  const t = performance.now() / 1000;
  const dt = Math.min(0.05, t - lastNow); lastNow = t;
  const elapsed = t - startT;
  const now = new Date();

  waveAcc += dt;
  let steps = 0;
  while (waveAcc >= 1 / 60 && steps < 3) { waveStep(); waveAcc -= 1 / 60; steps++; }
  if (steps === 3) waveAcc = 0;

  // fusions completing -> product is born
  for (const f of [...fusions]) if (elapsed - f.t0 >= FUSE_TIME) completeFusion(f, elapsed);

  syncClock(elapsed, now);
  if (spawnQueue.length && elapsed - lastSpawnAt >= 0.8) {
    lastSpawnAt = elapsed;
    const idx = spawnQueue.shift();
    const b = makeBall(idx, elapsed, false);
    b.slot = Math.max(0, aliveOf(idx).length - 1);
  }

  const [dx, dy] = duckPos(elapsed);
  if (elapsed >= duckWakeAt) {
    duckWakeAt = elapsed + 0.35;
    waveSplash(dx - 40, dy + 46, -22, 2);
  }

  for (const b of balls) {
    if (b.state !== "incoming") continue;
    if (elapsed - b.t0 >= TELEGRAPH + FALL) {
      b.state = "drifting"; b.impactT = elapsed; b.x = b.tx; b.y = b.ty;
      const sp = 15 + Math.random() * 30;
      b.vx = sp * Math.cos(b.drift); b.vy = sp * Math.sin(b.drift) * 0.6;
      waveSplash(b.tx, b.ty, -110, 3);
      const drops = [];
      for (let i = 0; i < 16; i++) drops.push([(Math.random() * 2 - 1), 40 + Math.random() * 55, 2.6 + Math.random() * 2.4]);
      droplets.push({ x: b.tx, y: b.ty, r: ballR(b), t0: elapsed, drops });
    }
  }
  droplets = droplets.filter(s => elapsed - s.t0 < 0.7);
  balls = balls.filter(b => !(b.state === "sinking" && elapsed - b.sinkT0 >= SINK_TIME));
  balls = balls.filter(b => !(b.state === "exiting" && elapsed - b.exitT0 >= 8));

  for (const b of balls) {
    if (b.state === "born" && elapsed - b.bornT0 >= 0.35) b.state = "drifting";
    let dampF;
    if (b.state === "drifting" || b.state === "settled" || b.state === "born") {
      const [sx, sy] = slotPos(b.idx, b.slot);
      b.vx += (sx - b.x) * 2.6 * dt;
      b.vy += (sy - b.y) * 2.6 * dt;
      dampF = Math.exp(-1.9 * dt);
      if (b.state === "drifting" && Math.hypot(sx - b.x, sy - b.y) < 3 && Math.hypot(b.vx, b.vy) < 6) b.state = "settled";
    } else if (b.state === "gathering" && b.fusion) {
      b.vx += (b.fusion.x - b.x) * 5.0 * dt;
      b.vy += (b.fusion.y - b.y) * 5.0 * dt;
      dampF = Math.exp(-2.4 * dt);
      const p = (elapsed - b.fusion.t0) / FUSE_TIME;
      b.drawScale = p < 0.6 ? 1 : 1 - 0.85 * ((p - 0.6) / 0.4);
    } else if (b.state === "exiting") {
      const ex2 = CX + RX * 1.02, ey2 = CY - 6;
      b.vx += (ex2 - b.x) * 0.55 * dt;
      b.vy += (ey2 - b.y) * 0.55 * dt;
      dampF = Math.exp(-1.2 * dt);
    } else if (b.state === "sinking") {
      dampF = Math.exp(-0.85 * dt);
    } else {
      continue;
    }
    b.vx *= dampF; b.vy *= dampF;
    b.x += b.vx * dt; b.y += b.vy * dt;
    if (b.state !== "gathering" && b.state !== "exiting") {
      const ex = (b.x - (dx + DUCK_OB_DX)) / DUCK_OB_RX;
      const ey = (b.y - (dy + DUCK_OB_DY)) / DUCK_OB_RY;
      const d2 = ex * ex + ey * ey;
      if (d2 < 1.0 && d2 > 1e-6) {
        const d = Math.sqrt(d2), push = (1 - d) * 2.2;
        b.x += ex / d * push * 60 * dt * 8; b.y += ey / d * push * 60 * dt * 8;
        b.vx += ex / d * push * 40; b.vy += ey / d * push * 40;
        if (b.state === "settled") b.state = "drifting";
      }
      const r = ballR(b);
      const bx = (b.x - CX) / (RX - r), by = (b.y - CY) / (RY - r * 0.8);
      const bd2 = bx * bx + by * by;
      if (bd2 > 1.0) {
        const d = Math.sqrt(bd2);
        b.x = CX + bx / d * (RX - r); b.y = CY + by / d * (RY - r * 0.8);
      }
    }
  }
  const drifting = balls.filter(b => b.state === "drifting");
  for (let i = 0; i < drifting.length; i++) for (let j = i + 1; j < drifting.length; j++) {
    const a = drifting[i], c = drifting[j];
    const ddx = c.x - a.x, ddy = (c.y - a.y) * 1.6;
    const dist = Math.hypot(ddx, ddy), minD = (ballR(a) + ballR(c)) * 0.98;
    if (dist > 1e-6 && dist < minD) {
      const ov = (minD - dist) / dist * 0.5;
      const ux = ddx * ov, uy = ddy * ov / 1.6;
      a.x -= ux; a.y -= uy; c.x += ux; c.y += uy;
    }
  }

  /* ---- render ---- */
  ctx.clearRect(0, 0, W, H);
  if (bg.complete && bg.naturalWidth) ctx.drawImage(bg, 0, 0, W, H);
  else { ctx.fillStyle = "#bfe3ee"; ctx.fillRect(0, 0, W, H); }

  renderShade();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(CX, CY, RX, RY, 0, 0, Math.PI * 2); ctx.clip();
  ctx.globalCompositeOperation = "overlay";
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(shadeCv, CX - RX, CY - RY, RX * 2, RY * 2);
  ctx.restore();
  ctx.globalCompositeOperation = "source-over";

  for (const b of balls) {
    if (b.state !== "incoming") continue;
    const age = elapsed - b.t0, r = ballR(b);
    let sc, al;
    if (age < TELEGRAPH) { const p = age / TELEGRAPH; sc = 0.35 + 0.65 * p; al = 0.05 + 0.13 * p; }
    else { const p = Math.min(1, (age - TELEGRAPH) / FALL); sc = 0.75 + 0.25 * p; al = 0.15 + 0.08 * p; }
    const rw = r * 1.05 * sc, rh = r * 0.42 * sc;
    const g = ctx.createRadialGradient(b.tx, b.ty + r * 0.45, 1, b.tx, b.ty + r * 0.45, rw);
    g.addColorStop(0, `rgba(45,80,110,${al})`); g.addColorStop(1, "rgba(45,80,110,0)");
    ctx.fillStyle = g;
    ctx.save(); ctx.translate(b.tx, b.ty + r * 0.45); ctx.scale(1, rh / rw); ctx.translate(-b.tx, -(b.ty + r * 0.45));
    ctx.beginPath(); ctx.arc(b.tx, b.ty + r * 0.45, rw, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  const actors = [];
  for (const b of balls) if (["drifting","settled","sinking","gathering","born","exiting"].includes(b.state)) actors.push([b.y, "ball", b]);
  actors.push([dy + 40, "duck", null]);
  for (const b of balls) if (b.state === "incoming" && elapsed - b.t0 >= TELEGRAPH) actors.push([b.ty, "falling", b]);
  actors.sort((a, b) => a[0] - b[0]);

  for (const [, kind, b] of actors) {
    if (kind === "ball") {
      const waveBob = Math.max(-6, Math.min(6, waveHeightAt(b.x, b.y) * 0.10));
      const bob = Math.sin(elapsed * 2.0 + b.phase) * 1.2 + waveBob;
      let bounce = 0;
      if (b.impactT !== null && b.impactT > 0) {
        const q = (elapsed - b.impactT) / BOUNCE;
        if (q < 1) bounce = -9 * Math.sin(Math.PI * q); else b.impactT = null;
      }
      let alpha = 1, sinkDy = 0, scale = b.drawScale || 1, submerge = 0.38;
      if (b.state === "sinking") {
        const p = Math.min(1, (elapsed - b.sinkT0) / SINK_TIME);
        alpha = 1 - p; sinkDy = p * 14; submerge = 0.38 + 0.75 * p;
      }
      if (b.state === "born") {
        const p = Math.min(1, (elapsed - b.bornT0) / 0.45);
        scale = 0.4 + 0.75 * p - 0.15 * p * p;   // pop with a slight overshoot
      }
      if (b.state === "exiting") {
        const p = (elapsed - b.exitT0) / 8;
        if (p > 0.75) { alpha = 1 - (p - 0.75) / 0.25; scale = 1 - 0.3 * ((p - 0.75) / 0.25); }
      }
      const r = Math.round(ballR(b) * scale);
      ctx.fillStyle = "rgba(70,110,140,.25)";
      ctx.beginPath(); ctx.ellipse(b.x, b.y + r * 0.42 + bob + sinkDy, r * 0.95, r * 0.30, 0, 0, Math.PI * 2); ctx.fill();
      drawBall(b.x, b.y + bob + bounce + sinkDy, r, b.idx, alpha, submerge);
    } else if (kind === "falling") {
      const p = Math.min(1, (elapsed - b.t0 - TELEGRAPH) / FALL);
      const ease = Math.pow(p, 1.7);
      const fy = b.ty - FALL_DIST * (1 - ease);
      const r = Math.round(ballR(b) * (0.72 + 0.28 * ease));
      drawBall(b.tx, fy, r, b.idx, 1, 0);
    } else {
      const waveBob = Math.max(-4, Math.min(4, waveHeightAt(dx, dy) * 0.06));
      const bob = Math.sin(elapsed * 1.6) * 3 + waveBob;
      if (duckImg.complete && duckImg.naturalWidth)
        ctx.drawImage(duckImg, dx - DUCK_W / 2, dy - DUCK_H / 2 + bob, DUCK_W, DUCK_H);
    }
  }

  for (const s of droplets) {
    const age = elapsed - s.t0, q = age / 0.7;
    for (const [ddx, hh, sz] of s.drops) {
      const dxx = s.x + ddx * s.r * 1.4 * q;
      const dyy = s.y - hh * 4 * q * (1 - q) - sz;
      const dr = sz * (1 - 0.35 * q);
      ctx.fillStyle = `rgba(235,245,255,${0.88 * (1 - q)})`;
      ctx.beginPath(); ctx.ellipse(dxx, dyy, dr, dr * 0.8, 0, 0, Math.PI * 2); ctx.fill();
    }
  }

  const dbg = document.getElementById("debug");
  if (dbg.style.display !== "none") {
    const want = desiredCounts(now);
    const cnt = [0, 1, 2, 3].map(i => aliveOf(i).length);
    dbg.textContent = `${now.toLocaleTimeString("ja-JP")} ／ 赤${cnt[0]}/${want[0]} 黄${cnt[1]}/${want[1]} 青${cnt[2]}/${want[2]} 分${cnt[3]}/${want[3]}`;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener("keydown", e => {
  if (e.key === "t" || e.key === "T") {
    const d = document.getElementById("debug");
    d.style.display = d.style.display === "block" ? "none" : "block";
  }
});
</script>
</body>
